<style>
  /* Layout: the poster as a single paper sheet; the route animates on the map, the gift text continues
     inside the same gold frame below it. Deliberate single look (paper + ink), fixed for any theme. */
  :root {
    --paper: #f3ecde;
    --table: #e6dac4;
    --ink: #161a30;
    --ink-soft: #55556a;
    --gold: #b08e5c;
    --gold-line: rgba(176, 142, 92, .75);
    --pin: #aa2836;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --script: "Cormorant Garamond", Garamond, Georgia, serif;
    color-scheme: light;
  }
  html { background: var(--table); }
  body {
    background: var(--table);
    color: var(--ink);
    font-family: var(--script);
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 32px;
    -webkit-text-size-adjust: 100%;
  }
  .sheet {
    max-width: 560px;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(22, 26, 48, .10), 0 18px 40px -18px rgba(22, 26, 48, .35);
  }
  .hero { position: relative; line-height: 0; }
  .hero img { display: block; width: 100%; max-width: 100%; height: auto; }
  .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ghost { fill: none; stroke: rgb(120, 84, 36); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 0 9; opacity: .55; }
  .r1 { fill: none; stroke: #5c3c0e; stroke-width: 6.4; stroke-linecap: round; stroke-linejoin: round; }
  .r2 { fill: none; stroke: #8a6229; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
  .r3 { fill: none; stroke: #dcc08c; stroke-width: 1.1; stroke-dasharray: 4 4; stroke-linecap: butt; }
  #rv-path { fill: none; stroke: #fff; stroke-width: 18; stroke-linecap: butt; stroke-linejoin: round; }
  #traveler { opacity: 0; transition: opacity .25s ease; }
  .pin { transform-box: fill-box; transform-origin: 50% 100%; }
  .pin.hit { animation: hop .7s cubic-bezier(.28, 1.7, .5, 1); }
  @keyframes hop { 0% { transform: scale(1); } 35% { transform: translateY(-6%) scale(1.2); } 100% { transform: scale(1); } }
  .ripple { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .ripple.go { animation: ripple 1.1s ease-out; }
  @keyframes ripple { 0% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }

  .gift {
    position: relative;
    padding: 6px max(7%, 22px) 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }
  .gift::before {
    content: "";
    position: absolute;
    left: 1.872%;
    right: 1.827%;
    top: 0;
    bottom: 3.6%;
    border: 1px solid var(--gold-line);
    border-top: 0;
    pointer-events: none;
  }
  .lead {
    margin: 0;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(19px, 5.1vw, 27px);
    line-height: 1.22;
    text-wrap: balance;
  }
  .lead + .lead { margin-top: -10px; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .orn i { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
  .orn svg { width: 17px; height: 16px; fill: var(--pin); }
  .fields { display: flex; flex-direction: column; gap: 20px; width: 100%; }
  .field { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .label {
    font-family: var(--display);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .value {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: .05em;
    font-variant-numeric: lining-nums;
    text-wrap: balance;
    overflow-wrap: anywhere;
    -webkit-user-select: all;
    user-select: all;
  }
  .iban { font-size: clamp(16px, 4.7vw, 22px); line-height: 1.35; }
  .holder { font-size: clamp(15px, 4.1vw, 18px); letter-spacing: .1em; }
  .bank { font-size: clamp(14px, 3.8vw, 16px); letter-spacing: .16em; font-weight: 500; }
  button.copy {
    font-family: var(--display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 0 20px;
    min-height: 40px;
    cursor: pointer;
    transition: background-color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button.copy:hover { background: #283057; }
  button.copy:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  button.copy.done { background: var(--pin); }
  .rule { align-self: center; width: 38%; height: 1px; background: var(--gold-line); opacity: .6; }

  .after {
    max-width: 560px;
    margin: 18px auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .replay {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 0 16px;
    min-height: 38px;
    cursor: pointer;
  }
  .replay svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .replay:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .sign { font-family: var(--display); font-size: 12px; letter-spacing: .24em; color: var(--ink-soft); }
  .sign em { font-family: var(--script); font-size: 18px; letter-spacing: 0; color: var(--gold); }
  @media (prefers-reduced-motion: reduce) {
    .pin.hit, .ripple.go { animation: none; }
    .replay { display: none; }
  }

  /* ---------- envelope intro ---------- */
  .envelope-scene { display: none; }
  html.sealed, html.sealed body { overflow: hidden; }
  html.sealed .envelope-scene {
    display: flex;
    position: fixed;
    inset: 0;
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(120% 80% at 50% 48%, #f1e9d8 0%, var(--table) 58%, #d8caae 100%);
    transition: opacity .75s ease;
  }
  .envelope-scene.leaving { opacity: 0; }
  .env-names { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; transition: opacity .5s ease, transform .6s ease; }
  .env-names .script { font-family: "Great Vibes", "Snell Roundhand", cursive; font-size: clamp(42px, 12.5vw, 60px); line-height: 1; color: var(--gold); }
  .env-names .date { font-family: var(--display); font-size: 12px; letter-spacing: .34em; color: var(--ink-soft); padding-left: .34em; }
  .env-wrap {
    position: relative;
    width: min(84vw, 400px);
    aspect-ratio: 100 / 68;
    margin-top: min(30vw, 130px);
    perspective: 1400px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .env-wrap > * { position: absolute; }
  .env-shadow { inset: 8% 4% -5% 4%; background: rgba(22, 26, 48, .30); filter: blur(18px); border-radius: 10px; z-index: 0; transition: opacity .6s ease; }
  .env-back { inset: 0; z-index: 1; border-radius: 3px; background: #e6d8bd; }
  .env-back::before { content: ""; position: absolute; inset: 3.5%; border-radius: 2px; background: repeating-linear-gradient(45deg, rgba(176,142,92,.16) 0 1px, transparent 1px 9px),repeating-linear-gradient(-45deg, rgba(176,142,92,.16) 0 1px, transparent 1px 9px),linear-gradient(160deg, #1d2240, #12152a); }
  .letter {
    left: 6%; right: 6%; top: 5%; bottom: 8%;
    z-index: 3;
    overflow: hidden;
    border-radius: 2px;
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(22, 26, 48, .18), 0 10px 22px -10px rgba(22, 26, 48, .45);
    transition: transform 1s cubic-bezier(.2, .75, .25, 1), opacity .6s ease;
  }
  .letter img { display: block; width: 100%; height: auto; }
  .pocket { inset: 0; z-index: 4; width: 100%; height: 100%; overflow: visible; }
  .flap { left: 0; right: 0; top: 0; height: 62%; z-index: 5; transform-origin: 50% 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.45, .05, .3, 1) .12s; }
  .flap.under { z-index: 2; }
  .flap svg { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: visible; }
  .flap .inside { transform: rotateX(180deg); }
  .grain { inset: 0; z-index: 5; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); mix-blend-mode: multiply; opacity: .22; border-radius: 3px; }
  .seal {
    left: 50%; top: 62%;
    z-index: 6;
    width: 23%;
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 3px 3px rgba(70, 12, 24, .40));
    transition: transform .5s cubic-bezier(.3, 1.4, .5, 1), opacity .45s ease;
    animation: breathe 2.6s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .seal svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .seal:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 50%; }
  @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.045); } }
  .env-hint { margin: 6px 0 0; font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-soft); animation: hint 2.6s ease-in-out infinite; transition: opacity .4s ease; }
  @keyframes hint { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .opening .seal { animation: none; transform: translate(-50%, -62%) scale(1.25) rotate(-10deg); opacity: 0; }
  .opening .env-names, .opening .env-hint { opacity: 0; animation: none; }
  .opening .env-names { transform: translateY(-12px); }
  .opening .flap { transform: rotateX(180deg); }
  .opening .flap-shadow { opacity: 0; }
  .rising .letter { transform: translateY(-64%); }
  .leaving .letter { transform: translateY(-78%) scale(1.04); }
  .leaving .env-shadow { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .seal, .env-hint { animation: none; }
  }

</style>

<script>
(function () {
  var DOTS = [0.0, 216.0, 392.9, 605.7, 719.7];
  var PY_LEN = 719.7;
  var route = document.getElementById("route");
  var rv = document.getElementById("rv-path");
  var traveler = document.getElementById("traveler");
  var pins = [].slice.call(document.querySelectorAll(".pin"));
  var ripples = [].slice.call(document.querySelectorAll(".ripple"));
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var total = route.getTotalLength ? route.getTotalLength() : PY_LEN;
  var dots = DOTS.map(function (v) { return v / PY_LEN * total; });
  var SPEED = 185, PAUSE = 420, DELAY = 700;
  var token = 0;

  rv.style.strokeDasharray = total + " " + (total + 40);
  function drawn(len) { rv.style.strokeDashoffset = String(total - len); }
  function restart(el, cls) { el.classList.remove(cls); el.getBoundingClientRect(); el.classList.add(cls); }
  function hit(i) { restart(pins[i], "hit"); restart(ripples[i], "go"); }
  function ease(p) { return -(Math.cos(Math.PI * p) - 1) / 2; }

  function play() {
    var my = ++token;
    if (reduce) { drawn(total); return; }
    drawn(0);
    traveler.style.opacity = 0;
    var segs = [], hits = [{ i: 0, t: DELAY }], t = DELAY;
    for (var k = 0; k < dots.length - 1; k++) {
      var dur = (dots[k + 1] - dots[k]) / SPEED * 1000;
      segs.push({ a: dots[k], b: dots[k + 1], t0: t, dur: dur });
      t += dur;
      hits.push({ i: k + 1, t: t });
      if (k < dots.length - 2) t += PAUSE;
    }
    var end = t, start = null, next = 0;
    function frame(now) {
      if (my !== token) return;
      if (start === null) start = now;
      var el = now - start;
      while (next < hits.length && el >= hits[next].t) { hit(hits[next].i); next++; }
      var len = 0, moving = false;
      for (var s = 0; s < segs.length; s++) {
        var g = segs[s];
        if (el >= g.t0 + g.dur) { len = g.b; continue; }
        if (el > g.t0) { len = g.a + (g.b - g.a) * ease((el - g.t0) / g.dur); moving = true; }
        break;
      }
      drawn(len);
      if (moving) {
        var pt = route.getPointAtLength(len);
        traveler.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ")");
        traveler.style.opacity = 1;
      } else {
        traveler.style.opacity = 0;
      }
      if (el < end + 50) requestAnimationFrame(frame);
      else { drawn(total); traveler.style.opacity = 0; }
    }
    requestAnimationFrame(frame);
  }

  document.getElementById("replay").addEventListener("click", play);
  var img = document.querySelector(".hero img");

  function startPage() {
    if (img.complete) play(); else img.addEventListener("load", play);
  }
  var html = document.documentElement;
  var scene = document.getElementById("envelope");
  if (html.classList.contains("sealed") && scene) {
    document.getElementById("letter-img").src = img.src;
    var flap = document.getElementById("flap");
    var opened = false;
    function finish() {
      html.classList.remove("sealed");
      scene.parentNode.removeChild(scene);
      window.scrollTo(0, 0);
      startPage();
    }
    function openEnvelope() {
      if (opened) return;
      opened = true;
      if (reduce) { scene.classList.add("leaving"); setTimeout(finish, 450); return; }
      scene.classList.add("opening");
      setTimeout(function () { flap.classList.add("under"); }, 520);
      setTimeout(function () { scene.classList.add("rising"); }, 950);
      setTimeout(function () { scene.classList.add("leaving"); }, 2150);
      setTimeout(finish, 2900);
    }
    document.getElementById("env-wrap").addEventListener("click", openEnvelope);
  } else {
    startPage();
  }


  [].forEach.call(document.querySelectorAll("button.copy"), function (btn) {
    var label = btn.textContent;
    btn.addEventListener("click", function () {
      var text = btn.getAttribute("data-copy");
      var target = document.getElementById(btn.getAttribute("data-target"));
      function ok() {
        btn.textContent = "Copiato";
        btn.classList.add("done");
        setTimeout(function () { btn.textContent = label; btn.classList.remove("done"); }, 1800);
      }
      function select() {
        try {
          var r = document.createRange();
          r.selectNodeContents(target);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
          btn.textContent = "Selezionato: copialo";
          setTimeout(function () { btn.textContent = label; }, 2400);
        } catch (e) {}
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, select);
        else select();
      } catch (e) { select(); }
    });
  });
})();
</script>
